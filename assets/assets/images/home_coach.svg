<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Tactivo coach character -->
  <defs>
    <clipPath id="headClip"><circle cx="256" cy="102" r="40"/></clipPath>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="262" cy="472" rx="118" ry="12" fill="#000000" opacity="0.25"/>

  <!-- ===== legs: track pants (long, tapered) ===== -->
  <g>
    <!-- left leg (viewer left) -->
    <path d="M220 288 L214 380 Q212 420 215 454 L247 454 Q249 415 250 380 L252 296 Z" fill="#1B222C"/>
    <!-- right leg -->
    <path d="M292 288 L298 380 Q300 420 297 454 L265 454 Q263 415 262 380 L260 296 Z" fill="#1B222C"/>
    <!-- lime side stripes -->
    <path d="M218 300 L214 452 L220 452 L224 300 Z" fill="#C8E636"/>
    <path d="M294 300 L298 452 L292 452 L288 300 Z" fill="#C8E636"/>
  </g>

  <!-- ===== shoes ===== -->
  <path d="M213 452 L247 452 L248 460 Q249 468 241 468 L205 468 Q197 468 199 460 Q201 454 213 452 Z" fill="#0E1219"/>
  <path d="M299 452 L265 452 L264 460 Q263 468 271 468 L307 468 Q315 468 313 460 Q311 454 299 452 Z" fill="#0E1219"/>
  <rect x="198" y="463" width="51" height="5" rx="2.5" fill="#C8E636"/>
  <rect x="263" y="463" width="51" height="5" rx="2.5" fill="#C8E636"/>

  <!-- ===== soccer ball beside right foot ===== -->
  <g transform="translate(346,444)">
    <circle cx="0" cy="0" r="25" fill="#F4F5F7"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#C9CDD4" stroke-width="2"/>
    <polygon points="0,-10 9.5,-3 6,8 -6,8 -9.5,-3" fill="#1B222C"/>
    <path d="M0,-10 L0,-25 M9.5,-3 L23,-8 M6,8 L14,20 M-6,8 L-14,20 M-9.5,-3 L-23,-8" stroke="#1B222C" stroke-width="2" fill="none"/>
  </g>

  <!-- ===== arms (drawn behind torso, slightly darker so they read) ===== -->
  <!-- left arm (viewer left) holding clipboard -->
  <path d="M208 176 Q188 188 181 216 L170 266 Q167 280 179 283 Q191 286 194 272 L206 224 Z" fill="#222B36"/>
  <!-- right arm, hand on hip -->
  <path d="M304 176 Q326 188 332 216 L340 262 Q343 277 331 280 Q319 283 316 269 L306 224 Z" fill="#222B36"/>
  <!-- lime cuffs -->
  <path d="M171 262 L194 267 L192 277 L169 272 Z" fill="#C8E636"/>
  <path d="M340 258 L318 264 L321 274 L342 269 Z" fill="#C8E636"/>
  <!-- hands -->
  <circle cx="181" cy="282" r="11" fill="#D29B6E"/>
  <circle cx="331" cy="280" r="11" fill="#D29B6E"/>

  <!-- ===== torso: quarter-zip training jacket ===== -->
  <path d="M256 156
           Q284 156 300 170
           Q314 182 318 210
           L324 286
           Q324 298 312 298
           L200 298
           Q188 298 188 286
           L194 210
           Q198 182 212 170
           Q228 156 256 156 Z" fill="#2A3340"/>
  <!-- hem band -->
  <path d="M189 280 L323 280 L324 288 Q324 298 312 298 L200 298 Q188 298 188 288 Z" fill="#1B222C"/>
  <!-- zip line -->
  <line x1="256" y1="164" x2="256" y2="280" stroke="#171D25" stroke-width="3"/>
  <line x1="256" y1="164" x2="256" y2="216" stroke="#C8E636" stroke-width="3.5"/>
  <!-- chest panel seams -->
  <path d="M196 234 Q216 228 228 230 M316 234 Q296 228 284 230" stroke="#1E2530" stroke-width="3" fill="none"/>

  <!-- Tactivo T mark on chest (italic T like the logo) -->
  <g transform="translate(291,192)">
    <path d="M-11 -11 L15 -11 L9 -3 L2 -3 L-4 15 L-12 15 L-6 -3 L-16 -3 Z" fill="#C8E636"/>
  </g>

  <!-- ===== collar (stand-up zip collar) ===== -->
  <path d="M230 148 L230 170 Q256 180 282 170 L282 148 Q256 140 230 148 Z" fill="#1B222C"/>
  <path d="M230 169 Q256 179 282 169" stroke="#C8E636" stroke-width="3.5" fill="none"/>

  <!-- ===== lanyard + whistle ===== -->
  <path d="M238 168 Q248 210 254 238 M274 168 Q264 210 258 238" stroke="#C8E636" stroke-width="4" fill="none"/>
  <g transform="translate(256,246)">
    <rect x="-3" y="-10" width="6" height="9" rx="2" fill="#AEB6C0"/>
    <rect x="-15" y="-7" width="17" height="9" rx="4.5" fill="#C3CAD3"/>
    <circle cx="1" cy="6" r="9" fill="#C3CAD3"/>
    <circle cx="1" cy="6" r="3" fill="#5A646F"/>
  </g>

  <!-- ===== clipboard in left hand (drawn over torso edge) ===== -->
  <g transform="translate(160,258) rotate(-6)">
    <rect x="0" y="0" width="52" height="72" rx="6" fill="#C8E636"/>
    <rect x="5" y="9" width="42" height="58" rx="3" fill="#F4F5F7"/>
    <rect x="16" y="-4" width="20" height="10" rx="3" fill="#5A646F"/>
    <!-- tactics scribble -->
    <circle cx="15" cy="26" r="4.5" fill="none" stroke="#1B222C" stroke-width="2.5"/>
    <path d="M19 29 Q31 36 38 47" stroke="#1B222C" stroke-width="2.5" fill="none" stroke-dasharray="4 3"/>
    <path d="M34 48 L42 56 M42 48 L34 56" stroke="#1B222C" stroke-width="2.5"/>
  </g>

  <!-- ===== head ===== -->
  <!-- neck -->
  <rect x="244" y="128" width="24" height="26" rx="8" fill="#C68A5C"/>
  <circle cx="256" cy="102" r="40" fill="#D29B6E"/>
  <!-- hair -->
  <g clip-path="url(#headClip)">
    <path d="M216 96 Q218 58 256 58 Q294 58 296 96 Q296 88 288 84 Q286 74 274 72 Q262 68 246 72 Q230 74 226 86 Q218 88 216 96 Z" fill="#20242B"/>
  </g>
  <!-- ears -->
  <circle cx="216" cy="104" r="7" fill="#D29B6E"/>
  <circle cx="296" cy="104" r="7" fill="#D29B6E"/>
  <!-- face -->
  <circle cx="242" cy="102" r="4" fill="#20242B"/>
  <circle cx="270" cy="102" r="4" fill="#20242B"/>
  <path d="M236 90 L249 88 M263 88 L276 90" stroke="#20242B" stroke-width="3" stroke-linecap="round"/>
  <path d="M246 121 Q256 129 266 121" stroke="#20242B" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- stubble hint -->
  <path d="M232 116 Q256 138 280 116 Q278 130 266 134 Q256 137 246 134 Q234 130 232 116 Z" fill="#20242B" opacity="0.12"/>
</svg>
